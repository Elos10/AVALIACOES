<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AVD Diagnóstico Escolar</title>
    <link rel="stylesheet" href="./public/styles.css?v=20260619-login-semed-card">
  </head>
  <body>
    <main id="app">
      <section style="font-family: Arial, sans-serif; padding: 24px; color: #0b2f78;">
        Carregando AVD Diagnóstico Escolar...
      </section>
    </main>
    <script type="module" src="./supabase-init.js?v=20260619-login-semed-card"></script>
    <script type="module" src="./public/app.js?v=20260619-login-semed-card"></script>
    <script>
      window.addEventListener("error", function (event) {
        var app = document.getElementById("app");
        if (!app || app.dataset.loaded === "true") return;
        app.innerHTML = '<section style="font-family: Arial, sans-serif; padding: 24px; color: #991b1b;"><h1>Falha ao carregar o sistema</h1><p>Confira se os arquivos foram publicados na raiz do GitHub Pages e se o arquivo public/app.js existe.</p><pre style="white-space: pre-wrap;">' + String(event.message || "Erro desconhecido") + '</pre></section>';
      });
    </script>
  </body>
</html>
