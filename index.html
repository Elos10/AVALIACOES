<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AVD Diagnóstico Escolar</title>
    <link rel="stylesheet" href="./public/styles.css">
    <style>
      :root { --bg: #f3f6ff; --panel: #ffffff; --line: #c8d7f2; --text: #101b3f; --muted: #52637f; --brand: #0038a8; --brand-2: #0057d9; --danger: #b42318; }
      * { box-sizing: border-box; }
      body { margin: 0; font-family: Arial, "Segoe UI", sans-serif; color: var(--text); background: var(--bg); }
      button, input, select, textarea { font: inherit; }
      button { border: 1px solid var(--line); background: var(--panel); color: var(--text); padding: .6rem .8rem; border-radius: 6px; cursor: pointer; }
      button.primary { background: var(--brand); color: white; border-color: var(--brand); }
      input, select, textarea { width: 100%; padding: .58rem .65rem; border: 1px solid var(--line); border-radius: 6px; background: #fbfdff; }
      label { display: grid; gap: .35rem; color: var(--muted); font-size: .84rem; }
      .login { min-height: 100vh; display: grid; place-items: center; padding: 24px; background: linear-gradient(135deg, #eef4ff, #f8fbff); }
      .login-panel { width: min(460px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 28px; box-shadow: 0 16px 40px rgba(0, 56, 168, .14); }
      .login-logo { display: block; max-width: 320px; width: 100%; max-height: 130px; object-fit: contain; margin: 0 auto 18px; }
      .login h1 { margin: 0 0 8px; color: var(--brand); font-size: 1.8rem; }
      .login p { margin: 0 0 20px; color: var(--muted); line-height: 1.45; }
      #loginForm { display: grid; gap: 14px; }
      .notice { padding: 12px; border-radius: 8px; border: 1px solid #b7e4c7; background: #edfdf3; color: #067647; margin-bottom: 12px; }
      .notice.error { border-color: #f3b5ad; background: #fff1f0; color: var(--danger); }
      .app-shell { min-height: 100vh; display: grid; grid-template-columns: 280px 1fr; }
      .content { padding: 20px; min-width: 0; }
      .card, .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 16px; }
      @media (max-width: 900px) { .app-shell { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <main id="app">
      <section style="font-family: Arial, sans-serif; padding: 24px; color: #0b2f78;">
        Carregando AVD Diagnóstico Escolar...
      </section>
    </main>
    <script type="module" src="./supabase-init.js"></script>
    <script type="module" src="./public/app.js"></script>
    <script>
      window.addEventListener("error", function (event) {
        var app = document.getElementById("app");
        if (!app || app.dataset.loaded === "true") return;
        app.innerHTML = '<section style="font-family: Arial, sans-serif; padding: 24px; color: #991b1b;"><h1>Falha ao carregar o sistema</h1><p>Confira se os arquivos foram publicados na raiz do GitHub Pages e se o arquivo public/app.js existe.</p><pre style="white-space: pre-wrap;">' + String(event.message || "Erro desconhecido") + '</pre></section>';
      });
    </script>
  </body>
</html>
