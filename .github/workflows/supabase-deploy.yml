name: Supabase e validacao

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  validate-and-schema:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validar GitHub Pages + Supabase
        run: npm run check

      - name: Verificar segredo do Supabase
        id: supabase-secret
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SUPABASE_DB_URL nao configurado. A validacao do sistema continuara, mas o schema nao sera aplicado automaticamente."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Instalar cliente PostgreSQL
        if: steps.supabase-secret.outputs.configured == 'true'
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Aplicar schema Supabase
        if: steps.supabase-secret.outputs.configured == 'true'
        id: apply-schema
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        shell: bash
        run: |
          set +e
          psql "$SUPABASE_DB_URL" -f supabase.sql
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "::warning::Nao foi possivel aplicar o schema pelo GitHub Actions. Se aparecer Network is unreachable, use no secret SUPABASE_DB_URL a string Session pooler do Supabase, ou execute supabase.sql manualmente no SQL Editor."
            exit 0
          fi
